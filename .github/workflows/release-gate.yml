name: release-gate

# Source, host-runtime, emulator, and package CI gates for CRM-III BAF Ops.
# Mirrors the local release_gate.ps1 source gates:
#   format warning -> analyze -> full Flutter test -> no-loss spine
#   -> secret-isolated Android release packaging -> Firestore rules/Jest
#   -> expression-limit scan -> Functions build/test
#
# Field gates remain manual: signed APK install, physical-device smoke,
# weak-network/offline drill, rollback/recovery, dependency/security triage.
# Android-emulator integration is runtime evidence, but it is never physical-
# device, production-backend, distribution, or pilot-handout evidence.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter-gates:
    name: Flutter host analysis + tests + no-loss contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate and publish test evidence taxonomy
        run: python3 tools/testing/verify_test_evidence_taxonomy.py

      - name: Canonical source and authority audit
        run: python3 tools/v4/v4_2_r1_canonical_audit.py --phase post-codegen

      - name: Production policy and package-verifier runtime gate
        shell: pwsh
        run: |
          ./tools/release/Test-ProductionReleasePolicy.ps1 `
            -PolicyPath release/production-release-policy.json `
            -AuthorityPath release/backend-authority.prod.json `
            -RepositoryRoot $PWD

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: dart format (warn-only)
        shell: bash
        run: |
          if dart format lib test --output=none --set-exit-if-changed > /dev/null 2>&1; then
            echo "::notice::formatting clean"
          else
            echo "::warning::some files are not dart-formatted (non-blocking; run 'dart format lib test')"
          fi

      - name: flutter analyze
        run: flutter analyze

      - name: Prepare and validate Isar native library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .dart_tool/ci
          cat > .dart_tool/ci/prepare_isar.dart <<'DART'
          import 'package:isar/isar.dart';

          Future<void> main() async {
            await Isar.initializeIsarCore(download: true);
          }
          DART

          cat > .dart_tool/ci/probe_isar.dart <<'DART'
          import 'dart:ffi';
          import 'dart:io';

          void main() {
            final lib = File('${Directory.current.path}/libisar.so');
            stdout.writeln('cwd=${Directory.current.path}');
            stdout.writeln('probe=${lib.path}');
            stdout.writeln('exists=${lib.existsSync()} length=${lib.existsSync() ? lib.lengthSync() : -1}');
            DynamicLibrary.open(lib.path);
            stdout.writeln('dlopen=ok');
          }
          DART

          dart run .dart_tool/ci/prepare_isar.dart

          echo "Isar native library candidates:"
          find "$HOME/.pub-cache" "$PWD" "${RUNNER_TEMP:-/tmp}" \
            -name libisar.so -type f -print0 2>/dev/null | xargs -0 -r file || true

          is_linux_x64_so() {
            file "$1" 2>/dev/null | grep -Eqi 'ELF 64-bit.*x86-64'
          }

          rm -f ./libisar.so

          found="$(
            find "$HOME/.pub-cache" "$PWD" "${RUNNER_TEMP:-/tmp}" \
              -name libisar.so -type f 2>/dev/null |
            while IFS= read -r candidate; do
              case "$candidate" in
                *jniLibs*|*android*|*Android*) continue ;;
              esac

              if is_linux_x64_so "$candidate"; then
                echo "$candidate"
                break
              fi
            done
          )"

          if [ -z "$found" ]; then
            echo "::error::No Linux x86-64 libisar.so candidate found after Isar preparation."
            find "$HOME/.pub-cache" "$PWD" "${RUNNER_TEMP:-/tmp}" \
              -maxdepth 10 -iname '*isar*' -print || true
            exit 1
          fi

          echo "Using Linux x86-64 Isar library: $found"
          cp "$found" ./libisar.so
          chmod 0644 ./libisar.so

          expected_isar_sha="7DC70DF7A2FBF63CD552ECA36708B6DEEB68CBD2AA270C1E201215E0BFC38EF1"
          actual_isar_sha="$(sha256sum ./libisar.so | awk '{print toupper($1)}')"
          test "$actual_isar_sha" = "$expected_isar_sha" || {
            echo "::error::Linux Isar core hash mismatch. Expected $expected_isar_sha, got $actual_isar_sha"
            exit 1
          }
          echo "::notice::Linux Isar core custody verified: $actual_isar_sha"

          ls -l ./libisar.so
          file ./libisar.so
          ldd ./libisar.so || true

          dart run .dart_tool/ci/probe_isar.dart

          sudo cp -f ./libisar.so /usr/lib/libisar.so
          sudo chmod 0644 /usr/lib/libisar.so
          ls -l /usr/lib/libisar.so
          file /usr/lib/libisar.so

          echo "LD_LIBRARY_PATH=$PWD:/usr/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: flutter test (full suite)
        shell: bash
        run: |
          set -euo pipefail
          test -f ./libisar.so
          file ./libisar.so | grep -Eqi 'ELF 64-bit.*x86-64'
          dart run .dart_tool/ci/probe_isar.dart
          flutter test --concurrency=1

      - name: no-loss regression spine
        shell: bash
        run: |
          set -euo pipefail
          test -f ./libisar.so
          file ./libisar.so | grep -Eqi 'ELF 64-bit.*x86-64'
          dart run .dart_tool/ci/probe_isar.dart
          flutter test --concurrency=1 \
            test/issue_1_tombstone_conflict_regression_test.dart \
            test/sync_remote_freshness_policy_test.dart \
            test/sync_coordinator_queue_contract_test.dart \
            test/planned_job_closure_guard_test.dart \
            test/planned_job_closure_attestation_test.dart \
            test/job_module_lifecycle_replay_contract_test.dart \
            test/maintenance_lifecycle_replay_contract_test.dart \
            test/release_startup_hygiene_contract_test.dart \
            test/firestore_deployment_readiness_contract_test.dart \
            test/runtime_module_population_fence_contract_test.dart \
            test/runtime_module_population_no_loss_test.dart \
            test/runtime_job_module_population_exception_test.dart \
            test/job_module_population_replay_equivalence_test.dart

  android-package:
    name: Android release package + cold-start proof (non-production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21 for Android packaging
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Build and verify secret-isolated release packages
        shell: pwsh
        run: |
          ./tools/release/Invoke-CIAndroidPackageProof.ps1 `
            -RepositoryRoot $PWD `
            -BuildName '0.0.0-ci' `
            -BuildNumber 1

      - name: Enable KVM for release cold-start proof
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cold-start the exact release APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 1536M
          heap-size: 256M
          script: pwsh -File tools/release/Test-CIAndroidReleaseStartup.ps1 -DeviceId emulator-5554 -ApkPath build/app/outputs/flutter-apk/app-release.apk

  android-emulator:
    name: Android emulator app-shell integration (not physical-device evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 21 for Android integration
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android app-shell integration suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 1536M
          heap-size: 256M
          script: flutter test integration_test/c04_operational_shell_android_test.dart -d emulator-5554 --reporter expanded

  firestore-rules:
    name: Firestore Rules + governed callable emulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21 for Firestore emulator
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Install root, Functions, and governed Firebase CLI deps
        shell: bash
        run: |
          set -euo pipefail
          expected_lock_sha="3E3B4FC56EC2F4C611FFB72822436943669905F70517940B9CD49205E9E86411"
          actual_lock_sha="$(sha256sum tooling/firebase-cli/package-lock.json | awk '{print toupper($1)}')"
          test "$actual_lock_sha" = "$expected_lock_sha" || {
            echo "::error::Governed Firebase CLI lockfile hash mismatch. Expected $expected_lock_sha, got $actual_lock_sha"
            exit 1
          }
          npm ci
          npm --prefix functions ci
          npm --prefix tooling/firebase-cli ci --ignore-scripts
          npm audit --audit-level=low
          npm --prefix functions audit --audit-level=low
          npm --prefix tooling/firebase-cli audit --audit-level=low
          npm run test:dependency-compat
          npm run test:firebase-client-key-custody
          npm run test:firestore-live-readback-custody
          npm run test:firestore-recoverability-readback-custody
          npm run test:functions-live-readback-custody
          npm run test:function-fleet-runtime-campaign
          npm run test:distribution-readback-custody
          npm run test:workflow-input-custody
          npm run test:workflow-action-custody

      - name: Gate 1B read-only authority classifier contracts
        run: npm run test:gate1b

      - name: A-05 read-only production sweep contracts
        run: npm run test:a05-production-sweep

      - name: Gate 1B Firestore and Auth emulator proof
        run: npm run emulator:test:gate1b

      - name: Run rules and governed transaction suites
        shell: bash
        run: |
          set -o pipefail
          npm run emulator:test:governed 2>&1 | tee governed_firestore_ci.log

      - name: Expression-limit check (must be ABSENT)
        shell: bash
        run: |
          if [ ! -f firestore-debug.log ]; then
            echo "::error::firestore-debug.log not found; expression-limit gate is inconclusive."
            exit 1
          fi
          if grep -q "maximum of 1000 expressions" firestore-debug.log; then
            echo "::error::expression-limit warning present in firestore-debug.log"
            grep "maximum of 1000 expressions" firestore-debug.log
            exit 1
          fi
          echo "::notice::clean — no expression-limit warning"

      - name: Upload rules evidence logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firestore-rules-logs
          path: |
            governed_firestore_ci.log
            firestore-debug.log
          if-no-files-found: ignore

  functions:
    name: Cloud Functions host build + non-emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build + host-test functions (emulator cases excluded)
        working-directory: functions
        run: npm test
