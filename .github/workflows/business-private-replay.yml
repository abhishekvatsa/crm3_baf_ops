name: Business private recorded replay

# PRIVATE PROPOSAL. The immutable tag, environment, variables and read-only WIF
# conditions must be independently enrolled. This file grants none of them.
#
# Windows runner: the recorded core (M) and its evidence were produced on Windows,
# and M's relocation path layer only completes Windows-recorded paths on Windows.
# Runtimes are pinned exactly (official setup actions and a SHA-256-pinned MinGit
# archive) and each enrolled executable must equal the one this job installed.
on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Exact candidate and descriptor request; data only
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: business-private-replay-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  replay:
    name: Business private replay
    runs-on: windows-2025
    environment: crm3-business-private-replay
    timeout-minutes: 125
    env:
      SELECTED_V: ${{ vars.BUSINESS31_VERIFIER_COMMIT }}
      TRUST_JSON: ${{ vars.BUSINESS31_TRUST_JSON }}
      TRUST_JSON_PART_2: ${{ vars.BUSINESS31_TRUST_JSON_PART_2 }}
      TRUST_JSON_PART_3: ${{ vars.BUSINESS31_TRUST_JSON_PART_3 }}
      TRUST_SHA: ${{ vars.BUSINESS31_TRUST_SHA256 }}
      MANIFEST_JSON: ${{ vars.BUSINESS31_SOURCE_MANIFEST_JSON }}
      NODE_EXE: ${{ vars.BUSINESS31_NODE_EXECUTABLE }}
      PYTHON_EXE: ${{ vars.BUSINESS31_PYTHON_EXECUTABLE }}
      PYTHON_SHA: ${{ vars.BUSINESS31_PYTHON_SHA256 }}
      GIT_EXE: ${{ vars.BUSINESS31_GIT_EXECUTABLE }}
      LAUNCHER_SHA: ${{ vars.BUSINESS31_LAUNCHER_SHA256 }}
      CANDIDATE_REQUEST: ${{ inputs.request_json }}
    steps:
      - name: Install pinned Python runtime
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.17'

      - name: Install pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.5'

      - name: Install pinned Git runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'business31-MinGit-2.56.1-64-bit.zip'
          Invoke-WebRequest -Uri 'https://github.com/git-for-windows/git/releases/download/v2.56.1.windows.1/MinGit-2.56.1-64-bit.zip' -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -cne '4A92850B6E917DA4FD010669B614B55DCCF5B0EC333A534CC4BE4700DFEFDAFD') {
            throw 'Pinned MinGit archive differs'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'business31-mingit')
          Remove-Item -LiteralPath $zip

      - name: Require independently selected immutable workflow revision
        shell: pwsh
        env:
          INSTALLED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Need([bool]$ok) { if (-not $ok) { throw 'Immutable workflow revision refused' } }
          Need ($env:SELECTED_V -cmatch '^[0-9a-f]{40}$')
          Need ($env:GITHUB_SHA -ceq $env:SELECTED_V)
          Need ($env:GITHUB_REF.StartsWith('refs/tags/', [StringComparison]::Ordinal))
          foreach ($exe in @($env:PYTHON_EXE, $env:NODE_EXE, $env:GIT_EXE)) {
            Need ([IO.Path]::IsPathFullyQualified([string]$exe) -and (Test-Path -LiteralPath $exe -PathType Leaf))
          }
          Need (($env:PYTHON_SHA -cmatch '^[A-F0-9]{64}$') -and ($env:LAUNCHER_SHA -cmatch '^[A-F0-9]{64}$'))
          # Enrolled executables must be exactly the pinned runtimes this job installed.
          Need ([IO.Path]::GetFullPath($env:PYTHON_EXE) -ceq [IO.Path]::GetFullPath($env:INSTALLED_PYTHON))
          Need ([IO.Path]::GetFullPath($env:NODE_EXE) -ceq [IO.Path]::GetFullPath((Get-Command node -CommandType Application).Source))
          Need ([IO.Path]::GetFullPath($env:GIT_EXE) -ceq [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'business31-mingit\ucrt64\bin\git.exe')))
          Need ((Get-FileHash -LiteralPath $env:PYTHON_EXE -Algorithm SHA256).Hash -ceq $env:PYTHON_SHA)

      - name: Checkout only the selected verifier V
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ vars.BUSINESS31_VERIFIER_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Prepare isolated public Git inputs without checking out candidate code
        id: input
        shell: pwsh
        env:
          # Independently enrolled environment inputs. Dispatch data can select
          # neither these records nor the retained private owner message.
          CLIENT_SELECTED_JSON: ${{ vars.BUSINESS31_CLIENT_SELECTED_JSON }}
          CLIENT_ORIGINAL_MESSAGE_B64: ${{ secrets.BUSINESS31_CLIENT_ORIGINAL_MESSAGE_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ((Get-FileHash -LiteralPath 'tools/release/business31HostedLauncher.py' -Algorithm SHA256).Hash -cne $env:LAUNCHER_SHA) {
            throw 'Hosted launcher differs from enrollment'
          }
          $prepare = @'
          import base64,hashlib,json,os,pathlib,re,subprocess
          def need(ok):
              if not ok: raise RuntimeError('Hosted input preparation refused')
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest().upper()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'business31-private-job'
          root.mkdir(mode=0o700,exist_ok=False)
          parts=[os.environ.get(key,'') for key in ('TRUST_JSON','TRUST_JSON_PART_2','TRUST_JSON_PART_3')]
          chunked=bool(parts[1] or parts[2])
          if chunked:
              encoded=[part.encode('utf-8') for part in parts]
              need(all(0<len(part)<=48000 for part in encoded))
              trust_raw=b''.join(encoded)
          else:
              trust_raw=parts[0].encode('utf-8')
          need(0<len(trust_raw)<=2*1024*1024)
          need(hashlib.sha256(trust_raw).hexdigest().upper()==os.environ['TRUST_SHA'])
          trust=json.loads(trust_raw);need(trust['verifier']['commit']==os.environ['SELECTED_V'])
          if chunked:
              need(type(trust.get('schemaVersion')) is int and trust['schemaVersion']==2 and trust.get('profile')=='build31-business-hosted-recorded-replay-v2')
          v2=trust.get('schemaVersion')==2 or trust.get('profile')=='build31-business-hosted-recorded-replay-v2' or 'coreVerifier' in trust or 'sourceIntegration' in trust
          if v2:
              need(trust.get('schemaVersion')==2 and trust.get('profile')=='build31-business-hosted-recorded-replay-v2')
              need(trust['coreVerifier']['commit']==trust['source']['commit'] and trust['coreVerifier']['tree']==trust['source']['tree'])
              need(trust['coreVerifier']['commit']!=trust['verifier']['commit'] and isinstance(trust['sourceIntegration'],dict) and len(trust['sourceIntegration'])>0)
          need(trust['pythonSha256']==os.environ['PYTHON_SHA'] and trust['launcherSha256']==os.environ['LAUNCHER_SHA'])
          git=pathlib.Path(os.environ['GIT_EXE']);need(git.is_absolute() and git.is_file() and not git.is_symlink() and sha(git)==trust['gitSha256'])
          req_raw=os.environ['CANDIDATE_REQUEST'].encode();need(0<len(req_raw)<=32768)
          req=json.loads(req_raw);client_mode=req.get('schemaVersion')==2
          need(not v2 or client_mode)
          need(req.get('schemaVersion') in (1,2))
          need(set(req)==({'schemaVersion','candidate','descriptorPointer','challenge'} if client_mode else {'schemaVersion','candidate','descriptorPointer'}))
          req['runId']=os.environ['GITHUB_RUN_ID'];req['runAttempt']=os.environ['GITHUB_RUN_ATTEMPT']
          S=req['candidate']['commit'];need(re.fullmatch('[0-9a-f]{40}',S) is not None)
          name=trust['repository']['name'];need(name==os.environ['GITHUB_REPOSITORY'] and re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+',name) is not None)
          for d in ['home','tmp','template','output']: (root/d).mkdir(mode=0o700)
          env={'PATH':str(git.parent),'HOME':str(root/'home'),'TMP':str(root/'tmp'),'TEMP':str(root/'tmp'),'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'NUL','GIT_TERMINAL_PROMPT':'0','GIT_NO_REPLACE_OBJECTS':'1','GIT_ALLOW_PROTOCOL':'https'}
          for key in ('SystemRoot','WINDIR','COMSPEC'):
              value=os.environ.get(key);need(isinstance(value,str) and value!='');env[key]=value
          def run(args):
              r=subprocess.run([str(git),'--no-replace-objects','-c','credential.helper=','-c','core.hooksPath='+str(root/'template'),'-c','protocol.allow=never','-c','protocol.https.allow=always',*args],env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=300)
              need(r.returncode==0)
          repo=root/'repository'
          run(['clone','--no-checkout','--no-local','--no-hardlinks','--template='+str(root/'template'),'--','https://github.com/'+name+'.git',str(repo)])
          run(['-C',str(repo),'fetch','--no-tags','origin',S])
          run(['-C',str(repo),'update-ref','refs/heads/business31-admitted-'+S,S])
          manifest=json.loads(os.environ['MANIFEST_JSON'])
          (root/'trust.json').write_bytes(trust_raw)
          (root/'input.json').write_text(json.dumps({'request':req,'repositoryRoot':str(repo),'gitExecutable':str(git),'sourceManifest':manifest}),encoding='utf8')
          client_sha=''
          if client_mode:
              selected_raw=os.environ['CLIENT_SELECTED_JSON'].encode();need(0<len(selected_raw)<=128*1024)
              selected=json.loads(selected_raw)
              original=base64.b64decode(os.environ['CLIENT_ORIGINAL_MESSAGE_B64'],validate=True)
              need(0<len(original)<=128*1024)
              need(selected['originalMessage']=={'sha256':hashlib.sha256(original).hexdigest().upper(),'bytes':len(original)})
              original_file=root/'original-client-message.bin';original_file.write_bytes(original);original_file.chmod(0o600)
              client={'schemaVersion':2 if v2 else 1,'profile':'build31-business-hosted-client-input-v2' if v2 else 'build31-business-hosted-client-input-v1','repositoryRoot':str(repo),
                      'gitExecutable':str(git),'selected':selected,'originalMessageFile':str(original_file)}
              client_raw=json.dumps(client,ensure_ascii=False).encode()
              client_file=root/'client-input.json';client_file.write_bytes(client_raw);client_file.chmod(0o600)
              client_sha=hashlib.sha256(client_raw).hexdigest().upper()
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
              out.write('candidate='+S+'\n')
              out.write('client_sha='+client_sha+'\n')
          '@
          $prepare | & $env:PYTHON_EXE -I -S -B -

      - name: Hide recorded original executable paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The recorded relocation names C:\Program Files\GitHub CLI\gh.exe; the replay
          # requires every recorded original path to be absent on this ephemeral runner.
          $recorded = 'C:\Program Files\GitHub CLI'
          if (Test-Path -LiteralPath $recorded) {
            Rename-Item -LiteralPath $recorded -NewName 'GitHub CLI.hidden-by-business31-replay'
          }
          if (Test-Path -LiteralPath (Join-Path $recorded 'gh.exe')) { throw 'Recorded original path remains available' }

      - name: Authenticate platform and replay exact private generation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLIENT_INPUT_SHA: ${{ steps.input.outputs.client_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $job = Join-Path $env:RUNNER_TEMP 'business31-private-job'
          $arguments = @('-I', '-S', '-B', 'tools/release/business31HostedLauncher.py',
            '--mode', 'replay', '--node', $env:NODE_EXE,
            '--trust', (Join-Path $job 'trust.json'), '--trust-sha256', $env:TRUST_SHA,
            '--input', (Join-Path $job 'input.json'),
            '--output', (Join-Path $job 'output\business31-hosted-result.json'),
            '--private-parent', (Join-Path $job 'tmp'))
          if (-not [string]::IsNullOrEmpty($env:CLIENT_INPUT_SHA)) {
            if ($env:CLIENT_INPUT_SHA -cnotmatch '^[A-F0-9]{64}$') { throw 'Client input commitment refused' }
            $arguments += @('--client-input', (Join-Path $job 'client-input.json'), '--client-input-sha256', $env:CLIENT_INPUT_SHA)
          }
          & $env:PYTHON_EXE @arguments

      - name: Publish only the strict sanitized result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: business31-hosted-${{ steps.input.outputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/business31-private-job/output/business31-hosted-result.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

      - name: Destroy owned private scratch
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $destroy = @'
          import os,pathlib,shutil
          parent=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root=parent/'business31-private-job'
          if root.exists():
              if root.is_symlink() or root.resolve().parent!=parent: raise RuntimeError('Scratch ownership differs')
              shutil.rmtree(root)
          '@
          $destroy | & $env:PYTHON_EXE -I -S -B -
