name: verification-artifact

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Verification semantic version, for example 0.70.1-verify.2
        required: true
        type: string
      build_number:
        description: Positive Android build number
        required: true
        type: number
      release_tag:
        description: Verification tag or evidence label
        required: true
        type: string
      release_id:
        description: Unique verification release ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verification-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Governed verification APK
    runs-on: ubuntu-latest
    env:
      CRM_DISPATCH_APP_VERSION: ${{ inputs.app_version }}
      CRM_DISPATCH_BUILD_NUMBER: ${{ inputs.build_number }}
      CRM_DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
      CRM_DISPATCH_RELEASE_ID: ${{ inputs.release_id }}
      CRM_WORKFLOW_COMMIT_SHA: ${{ github.sha }}
      CRM_WORKFLOW_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CRM_DISPATCH_APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]{0,63})?$ ]]
          [[ "$CRM_DISPATCH_BUILD_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$CRM_DISPATCH_BUILD_NUMBER" -le 2147483647
          [[ "$CRM_DISPATCH_RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$CRM_DISPATCH_RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$CRM_WORKFLOW_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          npm ci
          npm --prefix functions ci
          npm install --global firebase-tools

      - name: Prepare and prove Linux Isar native core
        shell: bash
        run: |
          set -euo pipefail

          selected=""

          while IFS= read -r candidate; do
            if file "$candidate" | grep -Eq 'ELF 64-bit.*x86-64'; then
              selected="$candidate"
              break
            fi
          done < <(
            find "$HOME/.pub-cache" \
              -type f \
              -name 'libisar.so' \
              ! -path '*/android/*' \
              -print
          )

          if [[ -z "$selected" ]]; then
            echo "No Linux x86-64 Isar core was found." >&2
            exit 1
          fi

          file "$selected"
          ldd "$selected"
          sudo install -m 0755 "$selected" /usr/lib/libisar.so

          python3 - <<'PY'
          import ctypes
          ctypes.CDLL('/usr/lib/libisar.so')
          print('Isar native-core load probe: PASS')
          PY

          isar_sha="$(sha256sum /usr/lib/libisar.so | awk '{print toupper($1)}')"

          echo "CRM_ISAR_CORE_PATH=/usr/lib/libisar.so" >> "$GITHUB_ENV"
          echo "CRM_ISAR_CORE_SHA256=$isar_sha" >> "$GITHUB_ENV"

      - name: Build and independently verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'verification-artifacts'
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File tools/release/New-VerificationArtifact.ps1 `
            -AppVersion $env:CRM_DISPATCH_APP_VERSION `
            -BuildNumber ([int]$env:CRM_DISPATCH_BUILD_NUMBER) `
            -ReleaseTag $env:CRM_DISPATCH_RELEASE_TAG `
            -ReleaseId $env:CRM_DISPATCH_RELEASE_ID `
            -ExpectedCommit $env:CRM_WORKFLOW_COMMIT_SHA `
            -ReleaseChannel 'verification' `
            -CiRunId $env:CRM_WORKFLOW_RUN_ID `
            -IsarCorePath $env:CRM_ISAR_CORE_PATH `
            -ExpectedIsarCoreSha256 $env:CRM_ISAR_CORE_SHA256 `
            -OutputRoot $output

      - name: Upload governed evidence package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.CRM_DISPATCH_RELEASE_ID }}
          path: ${{ runner.temp }}/verification-artifacts/${{ env.CRM_DISPATCH_RELEASE_ID }}
          if-no-files-found: error
          retention-days: 30
