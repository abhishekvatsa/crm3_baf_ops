name: Build31 public Linux runtime measurement

# Hash-only measurement on a never-merge branch. No checkout or target-code execution.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build31-public-runtime-measurement-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    name: Build31 public runtime hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Measure only existing canonical Node Python and Git executables
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python_selector="$(type -P python3)"
          git_selector="$(type -P git)"
          runtime_python="$(readlink -e -- "$python_selector")"
          runtime_git="$(readlink -e -- "$git_selector")"
          "$runtime_python" -I -S -B - "$python_selector" "$runtime_python" "$git_selector" "$runtime_git" "$GITHUB_STEP_SUMMARY" <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          import stat
          import sys
          
          if sys.platform != "linux" or sys.flags.isolated != 1 or sys.flags.no_site != 1 or not sys.dont_write_bytecode:
              raise RuntimeError("Isolated Linux measurement required")
          if len(sys.argv) != 6 or os.environ.get("RUNNER_OS") != "Linux" or os.environ.get("RUNNER_ARCH") != "X64":
              raise RuntimeError("Expected public Ubuntu x64 measurement inputs")
          
          def measure(selector, canonical):
              p = Path(canonical)
              if not p.is_absolute() or str(p.resolve(strict=True)) != canonical:
                  raise RuntimeError("Canonical absolute runtime path required")
              if any(x.is_symlink() for x in (p, *p.parents)):
                  raise RuntimeError("Resolved runtime path still redirects")
              before = p.stat()
              if not stat.S_ISREG(before.st_mode) or not os.access(p, os.X_OK) or not 0 < before.st_size <= 512 * 1024 * 1024:
                  raise RuntimeError("Bounded regular executable required")
              digest = hashlib.sha256()
              count = 0
              with p.open("rb") as stream:
                  while True:
                      chunk = stream.read(1024 * 1024)
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > before.st_size:
                          raise RuntimeError("Runtime grew while hashing")
                      digest.update(chunk)
              after = p.stat()
              fields = ("st_dev", "st_ino", "st_mode", "st_size", "st_mtime_ns", "st_ctime_ns")
              if count != before.st_size or any(getattr(before, x) != getattr(after, x) for x in fields):
                  raise RuntimeError("Runtime changed while hashing")
              return {"pathSelector": selector, "executable": canonical, "sha256": digest.hexdigest().upper(),
                      "bytes": count, "mode": oct(stat.S_IMODE(before.st_mode)), "regularCanonicalPath": True}
          
          cache = Path("/opt/hostedtoolcache/node")
          if not cache.is_dir() or cache.is_symlink() or str(cache.resolve(strict=True)) != str(cache):
              raise RuntimeError("Existing canonical Node cache required")
          entries = []
          for entry in cache.iterdir():
              entries.append(entry)
              if len(entries) > 64:
                  raise RuntimeError("Node cache entry bound exceeded")
          candidates = []
          for entry in entries:
              match = re.fullmatch(r"22\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", entry.name)
              if match:
                  if not entry.is_dir() or entry.is_symlink():
                      raise RuntimeError("Ordinary Node22 cache directory required")
                  candidates.append((tuple(map(int, entry.name.split("."))), entry))
          if not candidates:
              raise RuntimeError("No existing Node22 cache binary; install and fallback forbidden")
          version, node_dir = max(candidates, key=lambda item: item[0])
          node_selector = str(node_dir / "x64" / "bin" / "node")
          node_canonical = str(Path(node_selector).resolve(strict=True))
          if node_canonical != node_selector:
              raise RuntimeError("Node22 cache path must not redirect")
          node = measure(node_selector, node_canonical)
          node["cacheVersion"] = ".".join(map(str, version))
          node["selection"] = "highest existing Node22 cache version; no installation or fallback"
          node["binaryVersionExecuted"] = False
          python = measure(sys.argv[1], sys.argv[2])
          git = measure(sys.argv[3], sys.argv[4])
          if str(Path(sys.executable).resolve(strict=True)) != python["executable"]:
              raise RuntimeError("Measured Python is not the collector interpreter")
          keys = ("GITHUB_REPOSITORY", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "GITHUB_SHA", "GITHUB_REF",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion")
          identity = {key: os.environ.get(key) for key in keys}
          if identity["GITHUB_REPOSITORY"] != "abhishekvatsa/crm3_baf_ops" or identity["GITHUB_RUN_ATTEMPT"] != "1":
              raise RuntimeError("Expected repository and first attempt required")
          result = {"schemaVersion": 1, "documentType": "build31-public-hosted-runtime-measurement",
                    "recordedAtUtc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
                    "runsOn": "ubuntu-24.04", "identity": identity, "runtimes": {"node": node, "python": python, "git": git},
                    "limits": {"binaryAvailabilityAndHashesOnly": True, "futureImageBytesAssumed": False,
                               "compatibilityOrPrivateReplayProved": False, "runtimeEnrolled": False,
                               "credentialOrPrivateEvidenceAccessed": False, "constructionAuthorized": False,
                               "signingAuthorized": False, "distributionAuthorized": False}}
          raw = (json.dumps(result, sort_keys=True, indent=2) + "\n").encode("utf-8")
          print("BUILD31_RUNTIME_MEASUREMENT_JSON_BEGIN")
          sys.stdout.write(raw.decode("utf-8"))
          print("BUILD31_RUNTIME_MEASUREMENT_JSON_END")
          print("BUILD31_RUNTIME_MEASUREMENT_SHA256=" + hashlib.sha256(raw).hexdigest().upper())
          with open(sys.argv[5], "a", encoding="utf-8") as summary:
              summary.write("```json\n" + raw.decode("utf-8") + "```\n")
          PY
