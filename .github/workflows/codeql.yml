name: Build31 public controller runtime measurement

# SOURCE ONLY. The pinned setup action may acquire/install/execute public Node.
# The subsequent probe only hashes selected public files; no repository checkout.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build31-public-controller-runtime-measurement-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  measure:
    name: Build31 public controller runtime hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up exact public controller Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          architecture: x64
          check-latest: false
          package-manager-cache: false
          token: ''

      - name: Hash only post-setup controller Node and Git files
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (-not $IsLinux -or $env:RUNNER_OS -cne 'Linux' -or $env:RUNNER_ARCH -cne 'X64' -or
              $env:GITHUB_REPOSITORY -cne 'abhishekvatsa/crm3_baf_ops' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_RUN_ATTEMPT -cne '1') {
            throw 'Expected first-attempt public Linux x64 measurement.'
          }

          function Get-RegularControllerPath([string]$Value) {
            if ([string]::IsNullOrWhiteSpace($Value) -or -not [IO.Path]::IsPathFullyQualified($Value)) {
              throw 'Absolute selected executable required.'
            }
            $item = Get-Item -LiteralPath $Value -Force
            if ($item -isnot [IO.FileInfo]) { throw 'Selected executable must be a file.' }
            $current = $item
            while ($null -ne $current) {
              if ($current.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Selected executable path redirects.' }
              $current = if ($current -is [IO.DirectoryInfo]) { $current.Parent } else { $current.Directory }
            }
            $item.FullName
          }

          function Measure-ControllerBinary([string]$Selector) {
            $file = Get-RegularControllerPath $Selector
            $before = Get-Item -LiteralPath $file -Force
            $length = $before.Length
            $written = $before.LastWriteTimeUtc.Ticks
            $created = $before.CreationTimeUtc.Ticks
            $attributes = $before.Attributes
            $mode = [IO.File]::GetUnixFileMode($file)
            if ($length -le 0 -or $length -gt 268435456 -or ([int]$mode -band 73) -eq 0) {
              throw 'Bounded executable file required.'
            }
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            $afterPath = Get-RegularControllerPath $Selector
            $after = Get-Item -LiteralPath $afterPath -Force
            if ($afterPath -cne $file -or $after.Length -ne $length -or
                $after.LastWriteTimeUtc.Ticks -ne $written -or $after.CreationTimeUtc.Ticks -ne $created -or
                $after.Attributes -ne $attributes -or [IO.File]::GetUnixFileMode($file) -ne $mode -or
                $digest -cnotmatch '^[A-F0-9]{64}$') { throw 'Executable changed during hashing.' }
            [ordered]@{pathSelector=$Selector; executable=$file; bytes=$length; sha256=$digest;
              mode=[Convert]::ToString([int]$mode, 8); regularNoRedirectPath=$true}
          }

          # Exactly the application selection used by Initialize-Business31Controller.ps1.
          $nodeCommand = @(Get-Command node -CommandType Application -ErrorAction Stop)[0]
          $gitCommand = @(Get-Command git -CommandType Application -ErrorAction Stop)[0]
          $node = Measure-ControllerBinary $nodeCommand.Source
          $git = Measure-ControllerBinary $gitCommand.Source
          if ($node.executable -cne '/opt/hostedtoolcache/node/22.23.1/x64/bin/node') {
            throw 'PATH does not select the exact setup-node controller version path.'
          }

          $identity = [ordered]@{}
          foreach ($key in @('GITHUB_REPOSITORY', 'GITHUB_EVENT_NAME', 'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA',
              'GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion')) {
            $identity[$key] = [Environment]::GetEnvironmentVariable($key)
          }
          $result = [ordered]@{schemaVersion=1; documentType='build31-public-controller-runtime-measurement';
            recordedAtUtc=[DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ', [Globalization.CultureInfo]::InvariantCulture);
            runsOn='ubuntu-24.04'; identity=$identity;
            setup=[ordered]@{action='actions/setup-node@820762786026740c76f36085b0efc47a31fe5020'; requestedNodeVersion='22.23.1';
              architecture='x64'; checkLatest=$false; packageManagerCache=$false; publicAcquisitionInstallationAndVersionExecutionMayOccur=$true};
            runtimes=[ordered]@{node=$node; git=$git};
            collector=[ordered]@{shell='pwsh'; version=$PSVersionTable.PSVersion.ToString(); selector='Get-Command -CommandType Application first.Source';
              nodeOrGitExecutedByProbe=$false};
            limits=[ordered]@{binaryFilesMeasuredOnly=$true; setupActionExecuted=$true; repositoryCheckout=$false; repositoryCodeExecuted=$false;
              privateInputsOrEvidenceAccessed=$false; runtimeEnrolled=$false; compatibilityOrPrivateReplayProved=$false;
              futureImageBytesAssumed=$false; constructionAuthorized=$false; signingAuthorized=$false; distributionAuthorized=$false}}
          $raw = ($result | ConvertTo-Json -Depth 12 -Compress) + "`n"
          $rawBytes = [Text.UTF8Encoding]::new($false).GetBytes($raw)
          if ($rawBytes.Length -gt 32768) { throw 'Public measurement output exceeds bound.' }
          [Console]::Out.WriteLine('BUILD31_CONTROLLER_RUNTIME_MEASUREMENT_JSON_BEGIN')
          [Console]::Out.Write($raw)
          [Console]::Out.WriteLine('BUILD31_CONTROLLER_RUNTIME_MEASUREMENT_JSON_END')
          [Console]::Out.WriteLine('BUILD31_CONTROLLER_RUNTIME_MEASUREMENT_SHA256=' + [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($rawBytes)))
          $summary = '```json' + "`n" + $raw + '```' + "`n"
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary, [Text.UTF8Encoding]::new($false))
