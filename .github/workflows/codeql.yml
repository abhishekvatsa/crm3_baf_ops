name: Build31 public child dispatch actor measurement
run-name: Build31 public actor ${{ inputs.mode }} ${{ inputs.nonce }}

# Public preparation only. Never merge this measurement branch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Closed parent or child mode
        required: true
        type: choice
        options: [parent, child]
        default: parent
      nonce:
        description: One fresh public uppercase32hex nonce
        required: true
        type: string
      source_commit:
        description: Actual published measurement commit; no guessed future identity
        required: true
        type: string
      parent_run_id:
        description: Parent uses0; child receives actual parent run ID
        required: true
        type: string
        default: '0'
      parent_run_attempt:
        description: Parent uses0; child receives1
        required: true
        type: string
        default: '0'
      parent_actor_id:
        description: Parent uses0; child receives actual guarded parent actor ID
        required: true
        type: string
        default: '0'
      parent_triggering_actor_id:
        description: Parent uses0; child receives actual guarded triggering actor ID
        required: true
        type: string
        default: '0'

permissions:
  contents: read

concurrency:
  group: build31-public-child-actor-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  parent:
    # Invalid modes enter the parent guard and fail before any POST.
    if: ${{ inputs.mode != 'child' }}
    name: Build31 public dispatch parent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_NONCE: ${{ inputs.nonce }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      INPUT_PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
      INPUT_PARENT_ACTOR_ID: ${{ inputs.parent_actor_id }}
      INPUT_PARENT_TRIGGERING_ACTOR_ID: ${{ inputs.parent_triggering_actor_id }}
    steps:
      - name: Dispatch exactly one public child with the production token route
        shell: pwsh
        env:
          DISPATCH_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $client = $null
          try {
            function Need([bool]$ok) { if (-not $ok) { throw 'Public actor measurement refused.' } }
            function Same([object]$value, [string]$expected) { Need ($value -is [string] -and $value -ceq $expected) }
            function Id([object]$value) {
              Need (($value -is [int] -or $value -is [long]) -and $value -gt 0 -and $value -le 9007199254740991)
              $value.ToString([Globalization.CultureInfo]::InvariantCulture)
            }
            function Exact([object]$value, [string[]]$keys) {
              Need ($value -is [Collections.IDictionary])
              Need ((ConvertTo-Json -InputObject @($value.Keys | Sort-Object) -Compress) -ceq
                (ConvertTo-Json -InputObject @($keys | Sort-Object) -Compress))
            }
            function Read-ApiBody($response, $cancel, [int]$limit) {
              Need ([int]$response.StatusCode -ge 200 -and [int]$response.StatusCode -lt 300)
              if ($null -ne $response.Content.Headers.ContentLength) { Need ($response.Content.Headers.ContentLength -le $limit) }
              $stream = $response.Content.ReadAsStreamAsync($cancel.Token).GetAwaiter().GetResult()
              $memory = [IO.MemoryStream]::new()
              try {
                $buffer = [byte[]]::new(4096)
                while (($count = $stream.ReadAsync($buffer, 0, $buffer.Length, $cancel.Token).GetAwaiter().GetResult()) -gt 0) {
                  Need ($memory.Length + $count -le $limit)
                  $memory.Write($buffer, 0, $count)
                }
                $bytes = $memory.ToArray()
                $raw = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
                $value = ConvertFrom-Json -InputObject $raw -AsHashtable -NoEnumerate -Depth 40 -DateKind String
                Need ($value -is [Collections.IDictionary])
                [pscustomobject]@{value=$value;raw=$raw;sha256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes));bytes=$bytes.Length;status=[int]$response.StatusCode}
              } finally { $stream.Dispose(); $memory.Dispose() }
            }
            function Get-PublicRun([string]$runId) {
              Need ($runId -cmatch '^[1-9][0-9]{0,15}$')
              $request = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Get,
                ('https://api.github.com/repos/abhishekvatsa/crm3_baf_ops/actions/runs/' + $runId))
              $cancel = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(45))
              $response = $null
              try {
                $response = $client.SendAsync($request, [Net.Http.HttpCompletionOption]::ResponseHeadersRead, $cancel.Token).GetAwaiter().GetResult()
                Need ([int]$response.StatusCode -eq 200)
                $body = Read-ApiBody $response $cancel 65536
                $run = $body.value
                Same (Id $run.id) $runId
                Same (Id $run.workflow_id) '362994469'
                Same (Id $run.run_attempt) '1'
                Same $run.event 'workflow_dispatch'
                Same $run.head_sha $env:INPUT_SOURCE_COMMIT
                Same $run.head_branch 'codex/build31-child-dispatch-actor-measure-20261115'
                Same $run.path '.github/workflows/codeql.yml'
                Same $run.repository.full_name 'abhishekvatsa/crm3_baf_ops'
                Same (Id $run.repository.id) '1248257593'
                Same (Id $run.repository.owner.id) '213690022'
                Need ($run.repository.private -is [bool] -and $run.repository.private -eq $false)
                $null = Id $run.actor.id
                $null = Id $run.triggering_actor.id
                Need ($run.actor.login -is [string] -and $run.triggering_actor.login -is [string])
                $run
              } finally { if ($null -ne $response) { $response.Dispose() }; $cancel.Dispose(); $request.Dispose() }
            }
            function Public-Run($run) {
              [ordered]@{id=(Id $run.id);attempt=(Id $run.run_attempt);workflowId=(Id $run.workflow_id);
                headSha=$run.head_sha;headBranch=$run.head_branch;path=$run.path;event=$run.event;
                actor=[ordered]@{id=(Id $run.actor.id);login=$run.actor.login};
                triggeringActor=[ordered]@{id=(Id $run.triggering_actor.id);login=$run.triggering_actor.login}}
            }
            function Emit([string]$prefix, [object]$value) {
              $raw = (ConvertTo-Json -InputObject $value -Depth 20 -Compress) + "`n"
              $bytes = [Text.UTF8Encoding]::new($false).GetBytes($raw)
              Need ($bytes.Length -gt 0 -and $bytes.Length -le 16384)
              [Console]::Out.WriteLine($prefix + '_JSON_BEGIN')
              [Console]::Out.Write($raw)
              [Console]::Out.WriteLine($prefix + '_JSON_END')
              [Console]::Out.WriteLine($prefix + '_SHA256=' + [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)))
            }
            Need ($IsLinux -and $env:RUNNER_OS -ceq 'Linux' -and $env:RUNNER_ARCH -ceq 'X64')
            Same $env:GITHUB_REPOSITORY 'abhishekvatsa/crm3_baf_ops'
            Same $env:GITHUB_REPOSITORY_ID '1248257593'
            Same $env:GITHUB_REPOSITORY_OWNER_ID '213690022'
            Same $env:GITHUB_EVENT_NAME 'workflow_dispatch'
            Same $env:GITHUB_RUN_ATTEMPT '1'
            Same $env:GITHUB_REF 'refs/heads/codex/build31-child-dispatch-actor-measure-20261115'
            Same $env:GITHUB_WORKFLOW_REF 'abhishekvatsa/crm3_baf_ops/.github/workflows/codeql.yml@refs/heads/codex/build31-child-dispatch-actor-measure-20261115'
            Need ($env:INPUT_SOURCE_COMMIT -cmatch '^[0-9a-f]{40}$' -and $env:INPUT_NONCE -cmatch '^[A-F0-9]{32}$')
            Same $env:GITHUB_SHA $env:INPUT_SOURCE_COMMIT
            Same $env:GITHUB_WORKFLOW_SHA $env:INPUT_SOURCE_COMMIT
            Need ($env:GITHUB_RUN_ID -cmatch '^[1-9][0-9]{0,15}$')
            $event = ConvertFrom-Json -InputObject ([IO.File]::ReadAllText($env:GITHUB_EVENT_PATH, [Text.UTF8Encoding]::new($false, $true))) -AsHashtable -NoEnumerate -Depth 40 -DateKind String
            Exact $event.inputs @('mode','nonce','source_commit','parent_run_id','parent_run_attempt','parent_actor_id','parent_triggering_actor_id')
            foreach ($key in $event.inputs.Keys) { Need ($event.inputs[$key] -is [string]) }
            Same $event.inputs.mode $env:INPUT_MODE
            Same $event.inputs.nonce $env:INPUT_NONCE
            Same $event.inputs.source_commit $env:INPUT_SOURCE_COMMIT
            Same $event.inputs.parent_run_id $env:INPUT_PARENT_RUN_ID
            Same $event.inputs.parent_run_attempt $env:INPUT_PARENT_RUN_ATTEMPT
            Same $event.inputs.parent_actor_id $env:INPUT_PARENT_ACTOR_ID
            Same $event.inputs.parent_triggering_actor_id $env:INPUT_PARENT_TRIGGERING_ACTOR_ID
            $handler = [Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $handler.UseCookies = $false
            $handler.UseDefaultCredentials = $false
            $handler.Credentials = $null
            $client = [Net.Http.HttpClient]::new($handler)
            $client.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
            $client.DefaultRequestHeaders.Add('X-GitHub-Api-Version','2026-03-10')
            $client.DefaultRequestHeaders.UserAgent.ParseAdd('business31-prerequisite')
            Same $env:INPUT_MODE 'parent'
            foreach ($key in @('INPUT_PARENT_RUN_ID','INPUT_PARENT_RUN_ATTEMPT','INPUT_PARENT_ACTOR_ID','INPUT_PARENT_TRIGGERING_ACTOR_ID')) { Same ([Environment]::GetEnvironmentVariable($key)) '0' }
            Same $env:GITHUB_ACTOR_ID '213690022'
            Need ($env:DISPATCH_TOKEN -is [string] -and $env:DISPATCH_TOKEN.Length -gt 0 -and $env:DISPATCH_TOKEN.Length -le 4096 -and $env:DISPATCH_TOKEN -cnotmatch '[^\x21-\x7E]')
            $client.DefaultRequestHeaders.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer',$env:DISPATCH_TOKEN)
            [Environment]::SetEnvironmentVariable('DISPATCH_TOKEN',$null,'Process')
            $self = Get-PublicRun $env:GITHUB_RUN_ID
            Same (Id $self.actor.id) '213690022'
            Same (Id $self.triggering_actor.id) '213690022'
            Same $self.actor.login $env:GITHUB_ACTOR
            Same $self.triggering_actor.login $env:GITHUB_TRIGGERING_ACTOR
            $childInputs = [ordered]@{mode='child';nonce=$env:INPUT_NONCE;source_commit=$env:INPUT_SOURCE_COMMIT;
              parent_run_id=$env:GITHUB_RUN_ID;parent_run_attempt='1';parent_actor_id=(Id $self.actor.id);parent_triggering_actor_id=(Id $self.triggering_actor.id)}
            $body = [ordered]@{ref='codex/build31-child-dispatch-actor-measure-20261115';inputs=$childInputs}
            $url = 'https://api.github.com/repos/abhishekvatsa/crm3_baf_ops/actions/workflows/362994469/dispatches'
            Emit 'BUILD31_PUBLIC_CHILD_DISPATCH_INTENT' ([ordered]@{schemaVersion=1;role='parent-intent';parent=(Public-Run $self);nonce=$env:INPUT_NONCE;method='POST';url=$url;body=$body;maximumPostAttempts=1;retryAllowed=$false})
            $request = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Post,$url)
            $request.Content = [Net.Http.StringContent]::new((ConvertTo-Json -InputObject $body -Depth 10 -Compress),[Text.UTF8Encoding]::new($false),'application/json')
            $cancel = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(45))
            $response = $null
            try {
              # Exactly ONE POST. A timeout or unrecognized response stops; never repeat it.
              $response = $client.SendAsync($request,[Net.Http.HttpCompletionOption]::ResponseHeadersRead,$cancel.Token).GetAwaiter().GetResult()
              $created = Read-ApiBody $response $cancel 32768
              Exact $created.value @('workflow_run_id','run_url','html_url')
              $childRunId = Id $created.value.workflow_run_id
              Need ($childRunId -cne $env:GITHUB_RUN_ID)
              Same $created.value.run_url ('https://api.github.com/repos/abhishekvatsa/crm3_baf_ops/actions/runs/' + $childRunId)
              Same $created.value.html_url ('https://github.com/abhishekvatsa/crm3_baf_ops/actions/runs/' + $childRunId)
              Emit 'BUILD31_PUBLIC_CHILD_DISPATCH_RESULT' ([ordered]@{schemaVersion=1;role='parent-result';parent=(Public-Run $self);nonce=$env:INPUT_NONCE;
                childRunId=$childRunId;dispatchResponse=$created.value;dispatchResponseRawUtf8=$created.raw;dispatchResponseSha256=$created.sha256;dispatchResponseBytes=$created.bytes;httpStatus=$created.status;
                onePostOnly=$true;rerunAllowed=$false;credentialRecorded=$false})
            } finally { if ($null -ne $response) { $response.Dispose() };$cancel.Dispose();$request.Dispose() }
          } catch { [Console]::Error.WriteLine('BUILD31_PUBLIC_CHILD_ACTOR_PARENT_REFUSED');exit 1 }
          finally { if ($null -ne $client) { $client.Dispose() } }

  child:
    if: ${{ inputs.mode == 'child' }}
    name: Build31 public actor child
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_NONCE: ${{ inputs.nonce }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
      INPUT_PARENT_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
      INPUT_PARENT_ACTOR_ID: ${{ inputs.parent_actor_id }}
      INPUT_PARENT_TRIGGERING_ACTOR_ID: ${{ inputs.parent_triggering_actor_id }}
    steps:
      - name: Read only exact public parent and child actor metadata
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $client = $null
          try {
            function Need([bool]$ok) { if (-not $ok) { throw 'Public actor measurement refused.' } }
            function Same([object]$value, [string]$expected) { Need ($value -is [string] -and $value -ceq $expected) }
            function Id([object]$value) {
              Need (($value -is [int] -or $value -is [long]) -and $value -gt 0 -and $value -le 9007199254740991)
              $value.ToString([Globalization.CultureInfo]::InvariantCulture)
            }
            function Exact([object]$value, [string[]]$keys) {
              Need ($value -is [Collections.IDictionary])
              Need ((ConvertTo-Json -InputObject @($value.Keys | Sort-Object) -Compress) -ceq
                (ConvertTo-Json -InputObject @($keys | Sort-Object) -Compress))
            }
            function Read-ApiBody($response, $cancel, [int]$limit) {
              Need ([int]$response.StatusCode -ge 200 -and [int]$response.StatusCode -lt 300)
              if ($null -ne $response.Content.Headers.ContentLength) { Need ($response.Content.Headers.ContentLength -le $limit) }
              $stream = $response.Content.ReadAsStreamAsync($cancel.Token).GetAwaiter().GetResult()
              $memory = [IO.MemoryStream]::new()
              try {
                $buffer = [byte[]]::new(4096)
                while (($count = $stream.ReadAsync($buffer, 0, $buffer.Length, $cancel.Token).GetAwaiter().GetResult()) -gt 0) {
                  Need ($memory.Length + $count -le $limit)
                  $memory.Write($buffer, 0, $count)
                }
                $bytes = $memory.ToArray()
                $raw = [Text.UTF8Encoding]::new($false, $true).GetString($bytes)
                $value = ConvertFrom-Json -InputObject $raw -AsHashtable -NoEnumerate -Depth 40 -DateKind String
                Need ($value -is [Collections.IDictionary])
                [pscustomobject]@{value=$value;raw=$raw;sha256=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes));bytes=$bytes.Length;status=[int]$response.StatusCode}
              } finally { $stream.Dispose(); $memory.Dispose() }
            }
            function Get-PublicRun([string]$runId) {
              Need ($runId -cmatch '^[1-9][0-9]{0,15}$')
              $request = [Net.Http.HttpRequestMessage]::new([Net.Http.HttpMethod]::Get,
                ('https://api.github.com/repos/abhishekvatsa/crm3_baf_ops/actions/runs/' + $runId))
              $cancel = [Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(45))
              $response = $null
              try {
                $response = $client.SendAsync($request, [Net.Http.HttpCompletionOption]::ResponseHeadersRead, $cancel.Token).GetAwaiter().GetResult()
                Need ([int]$response.StatusCode -eq 200)
                $body = Read-ApiBody $response $cancel 65536
                $run = $body.value
                Same (Id $run.id) $runId
                Same (Id $run.workflow_id) '362994469'
                Same (Id $run.run_attempt) '1'
                Same $run.event 'workflow_dispatch'
                Same $run.head_sha $env:INPUT_SOURCE_COMMIT
                Same $run.head_branch 'codex/build31-child-dispatch-actor-measure-20261115'
                Same $run.path '.github/workflows/codeql.yml'
                Same $run.repository.full_name 'abhishekvatsa/crm3_baf_ops'
                Same (Id $run.repository.id) '1248257593'
                Same (Id $run.repository.owner.id) '213690022'
                Need ($run.repository.private -is [bool] -and $run.repository.private -eq $false)
                $null = Id $run.actor.id
                $null = Id $run.triggering_actor.id
                Need ($run.actor.login -is [string] -and $run.triggering_actor.login -is [string])
                $run
              } finally { if ($null -ne $response) { $response.Dispose() }; $cancel.Dispose(); $request.Dispose() }
            }
            function Public-Run($run) {
              [ordered]@{id=(Id $run.id);attempt=(Id $run.run_attempt);workflowId=(Id $run.workflow_id);
