            Same $env:INPUT_MODE 'child'
            Need ($env:INPUT_PARENT_RUN_ID -cmatch '^[1-9][0-9]{0,15}$' -and $env:INPUT_PARENT_RUN_ID -cne $env:GITHUB_RUN_ID)
            Same $env:INPUT_PARENT_RUN_ATTEMPT '1'
            Same $env:INPUT_PARENT_ACTOR_ID '213690022'
            Same $env:INPUT_PARENT_TRIGGERING_ACTOR_ID '213690022'
            # Public GETs have no Authorization header. This job has no dispatch token or POST code.
            $parent = Get-PublicRun $env:INPUT_PARENT_RUN_ID
            $self = Get-PublicRun $env:GITHUB_RUN_ID
            Same (Id $parent.actor.id) $env:INPUT_PARENT_ACTOR_ID
            Same (Id $parent.triggering_actor.id) $env:INPUT_PARENT_TRIGGERING_ACTOR_ID
            Same (Id $self.actor.id) $env:GITHUB_ACTOR_ID
            Same $self.actor.login $env:GITHUB_ACTOR
            Same $self.triggering_actor.login $env:GITHUB_TRIGGERING_ACTOR
            Emit 'BUILD31_PUBLIC_CHILD_ACTOR_MEASUREMENT' ([ordered]@{schemaVersion=1;documentType='build31-public-child-dispatch-actor-measurement';role='child';
              recordedAtUtc=[DateTimeOffset]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ',[Globalization.CultureInfo]::InvariantCulture);
              nonce=$env:INPUT_NONCE;parent=(Public-Run $parent);child=(Public-Run $self);apiVersion='2026-03-10';
              route='Parent github.token -> same workflow_dispatch endpoint/ref -> returned child run ID';
              limits=[ordered]@{publicRunMetadataOnly=$true;parentResultAndNativeMetadataRequireIndependentJoin=$true;recursiveDispatch=$false;
                childAuthorizationHeader=$false;repositoryCheckout=$false;repositoryCodeExecuted=$false;privateEnvironment=$false;secrets=$false;oidc=$false;
