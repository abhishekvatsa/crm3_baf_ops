name: crm3_baf_ops
description: CRM-III BAF Operations Smart Factory OS
publish_to: 'none'
version: 1.0.0-rc.1+5

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  firebase_messaging: ^16.4.1

  # Local DB
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.4

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Utilities
  uuid: ^4.5.3
  intl: ^0.19.0
  crypto: ^3.0.7
  google_sign_in: 6.2.1
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.5
  firebase_crashlytics: ^5.2.4
  firebase_app_check: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
