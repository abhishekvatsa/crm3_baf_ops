# Bounded for concurrent Gradle + Android emulator use on a 16 GB workstation.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=false

# Essential AndroidX settings
android.useAndroidX=true
android.enableJetifier=true

# Modern Android Gradle Plugin (AGP) 8.9.1 optimizations
# Encourages faster builds by using non-transitive R classes
android.nonTransitiveRClass=true

# Standard Kotlin style for version 2.1.0
kotlin.code.style=official

# Necessary for some Flutter plugins on newer AGP versions
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
