# High-performance JVM arguments for the steel plant workstation
# Preserving your -Xmx8G setting for complex builds
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Essential AndroidX settings
android.useAndroidX=true
android.enableJetifier=true

# Modern Android Gradle Plugin (AGP) 8.9.1 optimizations
# Encourages faster builds by using non-transitive R classes
android.nonTransitiveRClass=true

# Standard Kotlin style for version 2.1.0
kotlin.code.style=official

# Necessary for some Flutter plugins on newer AGP versions
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
